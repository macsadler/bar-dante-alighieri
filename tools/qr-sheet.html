<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Stampa i QR dei tavoli · Bar Dante Alighieri</title>
<style>
  :root{--cream:#faf3e6;--terracotta:#b5522f;--olive-d:#444825;--ink:#2e2418}
  *{box-sizing:border-box}
  body{margin:0;background:#efe6d0;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .controls{max-width:760px;margin:0 auto;padding:20px}
  .controls h1{font:600 1.7rem Georgia,serif;margin:0 0 .3rem}
  .controls p{margin:.3rem 0 1rem;color:#5b4d3b}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:12px}
  label{display:block;font-weight:700;font-size:.85rem;margin-bottom:3px}
  input{font:inherit;padding:10px 12px;border:1.5px solid #cdb893;border-radius:8px;background:#fff}
  #site{width:100%;min-width:260px}
  .grow{flex:1 1 320px}
  button{font:700 1rem inherit;font-family:inherit;padding:11px 22px;border-radius:999px;border:2px solid var(--terracotta);background:var(--terracotta);color:#fff;cursor:pointer}
  .warn{background:#fff6dc;border:1px dashed #c9a84a;border-radius:8px;padding:10px 12px;font-size:.92rem}
  .sheet{max-width:210mm;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:0;background:#fff}
  .card{border:1px dashed #b9a98a;padding:7mm 6mm;height:99mm;text-align:center;break-inside:avoid;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
  .bar{font:600 15pt Georgia,serif;letter-spacing:.01em}
  .bar span{color:var(--terracotta)}
  .table{font:600 40pt/1 Georgia,serif;color:var(--olive-d)}
  .table small{display:block;font:700 9pt system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--terracotta);margin-bottom:2pt}
  .qr svg{width:46mm;height:46mm;display:block}
  .how{font-size:9.5pt;line-height:1.3}
  .how em{color:#5b4d3b;font-style:normal;display:block}
  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    .controls{display:none}
    .sheet{max-width:none;width:210mm}
    .card{height:99mm}
  }
</style>
</head>
<body>
<div class="controls">
  <h1>QR dei tavoli</h1>
  <p>Un codice per tavolo: ogni QR porta il numero del tavolo, così l'ordine arriva già con il tavolo giusto. Stampa, ritaglia, plastifica.</p>
  <div class="row">
    <div class="grow"><label for="site">Indirizzo del sito (apri questa pagina dal sito vero e si compila da solo)</label>
      <input id="site" placeholder="https://…/"></div>
  </div>
  <div class="row">
    <div><label for="from">Dal tavolo</label><input id="from" type="number" min="1" max="99" value="1" style="width:90px"></div>
    <div><label for="to">Al tavolo</label><input id="to" type="number" min="1" max="99" value="12" style="width:90px"></div>
    <button id="print" type="button">Stampa</button>
  </div>
  <p class="warn" id="warn" hidden></p>
</div>
<div class="sheet" id="sheet"></div>
<script src="qrcode.js"></script>
<script>
(function () {
  var site = document.getElementById('site');
  var from = document.getElementById('from'), to = document.getElementById('to');
  var sheet = document.getElementById('sheet'), warn = document.getElementById('warn');
  // this page lives in /tools/, so the site root is one level up
  if (location.protocol.indexOf('http') === 0) site.value = new URL('../', location.href).href;

  function render() {
    sheet.innerHTML = '';
    var base = site.value.trim();
    warn.hidden = true;
    if (!/^https?:\/\/[^\s]+$/.test(base)) { warn.hidden = false; warn.textContent = 'Inserisci l’indirizzo del sito (https://…) per generare i QR.'; return; }
    if (location.protocol === 'file:' || /localhost|127\.0\.0\.1/.test(base)) {
      warn.hidden = false; warn.textContent = 'Attenzione: questo indirizzo funziona solo su questo computer. Per i QR veri, apri questa pagina dal sito online.';
    }
    if (base.slice(-1) !== '/' && base.indexOf('?') < 0 && !/\.html?$/.test(base)) base += '/';
    var a = Math.max(1, parseInt(from.value, 10) || 1), z = Math.min(99, parseInt(to.value, 10) || a);
    for (var n = a; n <= z; n++) {
      var url = base + '?table=' + n + '#carta';
      var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
      var card = document.createElement('div'); card.className = 'card';
      card.innerHTML = '<div class="bar">Bar Dante <span>Alighieri</span></div>' +
        '<div class="table"><small>Tavolo · Table</small>' + n + '</div>' +
        '<div class="qr">' + qr.createSvgTag({ cellSize: 6, margin: 4, scalable: true }) + '</div>' +
        '<div class="how">Inquadra per vedere il menu e ordinare<em>Scan for the menu and to order</em></div>';
      card.setAttribute('data-url', url);
      sheet.appendChild(card);
    }
  }
  [site, from, to].forEach(function (el) { el.addEventListener('input', render); });
  document.getElementById('print').addEventListener('click', function () { window.print(); });
  render();
})();
</script>
</body>
</html>
